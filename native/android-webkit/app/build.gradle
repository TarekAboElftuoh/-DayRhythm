plugins {
    id 'com.android.application'
}

def resolvedGithubRepo = (project.findProperty('GITHUB_REPO') ?: '').toString()
def resolvedRemoteWsUrl = (project.findProperty('REMOTE_WS_URL') ?: '').toString()
def resolvedVersionCode = (project.findProperty('VERSION_CODE') ?: '1').toString().toInteger()
def resolvedVersionName = (project.findProperty('VERSION_NAME') ?: '1.0.1').toString()

android {
    namespace 'app.dayrhythm.mobile'
    compileSdk 34

    defaultConfig {
        applicationId 'app.dayrhythm.mobile'
        minSdk 26
        targetSdk 34
        versionCode resolvedVersionCode
        versionName resolvedVersionName

        buildConfigField 'String', 'GITHUB_REPO', "\"${resolvedGithubRepo}\""
        buildConfigField 'String', 'REMOTE_WS_URL', "\"${resolvedRemoteWsUrl}\""

        resValue 'string', 'app_name', 'إيقاع اليوم'
        resValue 'string', 'file_provider_authority', 'app.dayrhythm.mobile.fileprovider'
        resValue 'string', 'widget_gemini_description', 'اكتب أو كلّم Gemini من الشاشة الرئيسية'
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            def ksPath = System.getenv('ANDROID_KEYSTORE_PATH') ?: project.findProperty('KEYSTORE_PATH') ?: 'dayrhythm-release.p12'
            def ksFile = file(ksPath)
            if (ksFile.exists()) {
                storeFile ksFile
                storeType ksPath.toString().endsWith('.p12') ? 'PKCS12' : 'JKS'
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: (project.findProperty('KEYSTORE_PASSWORD') ?: 'dayrhythm2026')
                keyAlias System.getenv('ANDROID_KEY_ALIAS') ?: (project.findProperty('KEY_ALIAS') ?: 'dayrhythm')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD') ?: (project.findProperty('KEY_PASSWORD') ?: 'dayrhythm2026')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.work:work-runtime:2.9.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
