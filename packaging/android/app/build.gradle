plugins {
    id 'com.android.application'
}

def resolvedAppUrl = (project.findProperty('APP_URL') ?: 'https://ais-pre-nldzeytdlkfysmfvrz4pkn-146281240493.europe-west2.run.app').toString()
def resolvedAppHost = (project.findProperty('APP_HOST') ?: 'ais-pre-nldzeytdlkfysmfvrz4pkn-146281240493.europe-west2.run.app').toString()
def resolvedVersionCode = (project.findProperty('VERSION_CODE') ?: '1').toString().toInteger()
def resolvedVersionName = (project.findProperty('VERSION_NAME') ?: '1.0.0').toString()

android {
    namespace 'app.dayrhythm.mobile'
    compileSdk 34

    defaultConfig {
        applicationId 'app.dayrhythm.mobile'
        minSdk 26
        targetSdk 34
        versionCode resolvedVersionCode
        versionName resolvedVersionName

        resValue 'string', 'app_name', 'إيقاع اليوم'
        resValue 'string', 'launch_url', resolvedAppUrl
        resValue 'string', 'host_name', resolvedAppHost
        resValue 'string', 'file_provider_authority', 'app.dayrhythm.mobile.fileprovider'
    }

    signingConfigs {
        release {
            def ksPath = System.getenv('ANDROID_KEYSTORE_PATH') ?: project.findProperty('KEYSTORE_PATH')
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: (project.findProperty('KEYSTORE_PASSWORD') ?: 'dayrhythm2026')
                keyAlias System.getenv('ANDROID_KEY_ALIAS') ?: (project.findProperty('KEY_ALIAS') ?: 'dayrhythm')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD') ?: (project.findProperty('KEY_PASSWORD') ?: 'dayrhythm2026')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (System.getenv('ANDROID_KEYSTORE_PATH') || project.findProperty('KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.core:core:1.13.1'
}
