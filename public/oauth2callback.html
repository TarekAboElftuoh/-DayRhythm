<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>إيقاع اليوم — جارٍ إكمال الربط</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; color: #7fffd4; font-family: system-ui, sans-serif; }
      body { display: flex; align-items: center; justify-content: center; }
    </style>
  </head>
  <body>
    <p>جارٍ إكمال الربط الدائم مع Google…</p>
    <script>
      // Google redirects here after consent (a real file, so every host — APK asset loader,
      // Windows WebView2 folder mapping, PWA hosting — can serve it). Hand the result to the app.
      var q = window.location.search ? window.location.search.slice(1) : '';
      window.location.replace('/index.html?oauth2=1' + (q ? '&' + q : ''));
    </script>
  </body>
</html>
