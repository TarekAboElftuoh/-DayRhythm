name: Build DayRhythm APK & Windows EXE (Native v2)

on:
  workflow_dispatch:
    inputs:
      remote_ws_url:
        description: 'Optional Remote WebSocket Sync URL (leave empty to use Firestore real-time sync)'
        required: false
        default: ''
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: write

jobs:
  test-cpp-core:
    name: Build & Test C++20 DayRhythmCore
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure, build, and test C++20 core
        run: |
          cmake -S core -B core/build-linux -DCMAKE_BUILD_TYPE=Release
          cmake --build core/build-linux
          ctest --test-dir core/build-linux --output-on-failure

  build-web-bundle:
    name: Build DayRhythm Web Bundle (Zero-SW Standalone)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies cleanly and build standalone web bundle
        env:
          VITE_APP_VERSION: v2.0.${{ github.run_number }}
          VITE_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || vars.GEMINI_API_KEY }}
          VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          VITE_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          rm -f bun.lock package-lock.json
          npm install --no-package-lock --legacy-peer-deps --no-audit --no-fund
          npm run lint
          npm test
          npm run build:native
          node scripts/png-to-ico.mjs public/pwa-512x512.png dist-icons/app.ico

      - name: Package lightweight Web OTA bundle (dayrhythm-web-ota.zip)
        run: |
          mkdir -p release-ota
          (cd dist && zip -qr ../release-ota/dayrhythm-web-ota.zip .)

      - name: Upload built web bundle
        uses: actions/upload-artifact@v4
        with:
          name: dayrhythm-web-dist
          path: dist/
          retention-days: 1

      - name: Upload Web OTA zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: DayRhythm-Web-OTA
          path: release-ota/dayrhythm-web-ota.zip
          retention-days: 30

      - name: Upload generated Windows ICO icon
        uses: actions/upload-artifact@v4
        with:
          name: dayrhythm-win-icon
          path: dist-icons/app.ico
          retention-days: 1

  build-android-apk:
    name: Build Android APK (AndroidX WebViewAssetLoader + WorkManager)
    needs: [build-web-bundle]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download pre-built DayRhythm web bundle into APK assets
        uses: actions/download-artifact@v4
        with:
          name: dayrhythm-web-dist
          path: native/android-webkit/app/src/main/assets/www

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Ensure Android NDK & CMake for C++20 JNI core
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -n "$SDK_ROOT" ] && command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --sdk_root="$SDK_ROOT" "ndk;26.3.11579264" "cmake;3.22.1" >/dev/null || true
          fi

      - name: Copy DayRhythm icons into Android resources
        run: |
          mkdir -p native/android-webkit/app/src/main/res/mipmap-xxxhdpi
          mkdir -p native/android-webkit/app/src/main/res/mipmap-xhdpi
          cp public/pwa-512x512.png native/android-webkit/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp public/pwa-512x512.png native/android-webkit/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          cp public/pwa-192x192.png native/android-webkit/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp public/pwa-192x192.png native/android-webkit/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png

      - name: Prepare permanent Android release signing keystore (enables in-place APK upgrades forever)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KS_FILE="$RUNNER_TEMP/dayrhythm-release.p12"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$KS_FILE"
            echo "ANDROID_KEYSTORE_PASSWORD=${KEYSTORE_PASS:-dayrhythm2026}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=${KEY_ALIAS_SECRET:-dayrhythm}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=${KEY_PASS:-dayrhythm2026}" >> "$GITHUB_ENV"
          elif [ -f "native/android-webkit/app/dayrhythm-release.p12" ]; then
            cp "native/android-webkit/app/dayrhythm-release.p12" "$KS_FILE"
            echo "ANDROID_KEYSTORE_PASSWORD=dayrhythm2026" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=dayrhythm" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=dayrhythm2026" >> "$GITHUB_ENV"
          else
            echo "ERROR: Permanent keystore native/android-webkit/app/dayrhythm-release.p12 missing!"
            exit 1
          fi
          echo "ANDROID_KEYSTORE_PATH=$KS_FILE" >> "$GITHUB_ENV"

      - name: Build signed standalone release APK
        working-directory: native/android-webkit
        run: |
          NEXT_VC=$(( ${{ github.run_number }} + 100 ))
          gradle assembleRelease \
            -PGITHUB_REPO="${{ github.repository }}" \
            -PREMOTE_WS_URL="${{ inputs.remote_ws_url || '' }}" \
            -PVERSION_CODE="$NEXT_VC" \
            -PVERSION_NAME="2.0.${{ github.run_number }}"

      - name: Stage APK artifact
        run: |
          mkdir -p release-android
          cp native/android-webkit/app/build/outputs/apk/release/app-release.apk release-android/DayRhythm-OnePlus12R.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DayRhythm-Android-APK
          path: release-android/DayRhythm-OnePlus12R.apk
          retention-days: 30

  build-windows-exe:
    name: Build Windows EXE (.NET 8 + Edge WebView2 + Inno Setup)
    needs: [build-web-bundle]
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download pre-built DayRhythm web bundle into Windows www
        uses: actions/download-artifact@v4
        with:
          name: dayrhythm-web-dist
          path: native/windows-dotnet/www

      - name: Download generated Windows icon
        uses: actions/download-artifact@v4
        with:
          name: dayrhythm-win-icon
          path: native/windows-dotnet

      - name: Inject version, GitHub repo & WebSocket config
        shell: pwsh
        run: |
          $repoFull = "${{ github.repository }}"
          $parts = $repoFull.Split("/")
          $repoOwner = $parts[0]
          $repoName = $parts[1]
          $ver = "2.0.${{ github.run_number }}"
          $wsUrl = "${{ inputs.remote_ws_url || '' }}"

          $cfgPath = "native/windows-dotnet/AppConfig.cs"
          $cfg = Get-Content $cfgPath -Raw
          $cfg = $cfg.Replace("DAYRHYTHM_GITHUB_OWNER", $repoOwner)
          $cfg = $cfg.Replace("DAYRHYTHM_GITHUB_REPO", $repoName)
          $cfg = $cfg.Replace("DAYRHYTHM_APP_VERSION", $ver)
          $cfg = $cfg.Replace("DAYRHYTHM_REMOTE_WS_URL", $wsUrl)
          Set-Content -Path $cfgPath -Value $cfg -NoNewline

          $csprojPath = "native/windows-dotnet/DayRhythm.csproj"
          $csproj = Get-Content $csprojPath -Raw
          $csproj = $csproj.Replace("<Version>1.0.0</Version>", "<Version>$ver</Version>")
          Set-Content -Path $csprojPath -Value $csproj -NoNewline

      - name: Build C++20 DayRhythmCore.dll
        shell: pwsh
        run: |
          cmake -S core -B core/build-win -A x64
          cmake --build core/build-win --config Release
          $dll = Get-ChildItem -Recurse core/build-win -Filter "DayRhythmCore.dll" | Select-Object -First 1
          if (-not $dll) { throw "DayRhythmCore.dll not found after CMake build" }
          Copy-Item $dll.FullName "native/windows-dotnet/DayRhythmCore.dll" -Force

      - name: Publish self-contained .NET 8 + WebView2 Windows app
        shell: pwsh
        run: |
          dotnet publish native/windows-dotnet/DayRhythm.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o native/windows-dotnet/publish-out

      - name: Build DayRhythm-Setup.exe (Inno Setup) and DayRhythm-Portable.zip
        shell: pwsh
        run: |
          $ver = "2.0.${{ github.run_number }}"
          New-Item -ItemType Directory -Force -Path "release-windows" | Out-Null

          Compress-Archive -Path "native/windows-dotnet/publish-out\*" -DestinationPath "release-windows/DayRhythm-Portable.zip" -Force

          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=$ver" "native/windows-dotnet/installer.iss"
          Copy-Item "native/windows-dotnet/installer-out/DayRhythm-Setup.exe" "release-windows/DayRhythm-Setup.exe" -Force

      - name: Upload Windows EXE & Portable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DayRhythm-Windows-EXE
          path: |
            release-windows/DayRhythm-Setup.exe
            release-windows/DayRhythm-Portable.zip
          retention-days: 30

  publish-release:
    name: Publish GitHub Release (Direct APK & Windows EXE Downloads)
    needs: [build-android-apk, build-windows-exe]
    if: always() && (needs.build-android-apk.result == 'success' || needs.build-windows-exe.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Download Android APK (if built)
        if: needs.build-android-apk.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: DayRhythm-Android-APK
          path: release-files

      - name: Download Windows EXE (if built)
        if: needs.build-windows-exe.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: DayRhythm-Windows-EXE
          path: release-files

      - name: Download Web OTA bundle
        uses: actions/download-artifact@v4
        with:
          name: DayRhythm-Web-OTA
          path: release-files

      - name: Create latest GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v2.0.${{ github.run_number }}"
          cat <<'EOF' > release-notes.md
          ## إيقاع اليوم | DayRhythm — تحديثات فورية (OTA) + تطبيقات أصلية خفيفة

          - **تحديث فوري بدون إعادة تثبيت (`dayrhythm-web-ota.zip`):**
            - يقوم كل من تطبيق **الموبايل (Android)** وتطبيق **الكمبيوتر (Windows Setup & Portable)** بتنزيل وتطبيق هذا الملف تلقائياً في ثانيتين داخل التطبيق دون الحاجة لإعادة تحميل APK أو فك ضغط Portable في كل مرة.
          - **OnePlus 12R (أندرويد):** `DayRhythm-OnePlus12R.apk`
          - **الكمبيوتر (Windows 64-bit):** `DayRhythm-Setup.exe` و `DayRhythm-Portable.zip`
          EOF

          FILES=()
          for f in release-files/dayrhythm-web-ota.zip release-files/DayRhythm-OnePlus12R.apk release-files/DayRhythm-Setup.exe release-files/DayRhythm-Portable.zip; do
            if [ -f "$f" ]; then FILES+=("$f"); fi
          done

          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No release artifacts found!"
            exit 1
          fi

          gh release delete "$TAG" --repo "${{ github.repository }}" --cleanup-tag --yes 2>/dev/null || true
          for attempt in 1 2 3; do
            echo "Publishing release $TAG (attempt $attempt/3)..."
            if gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              "${FILES[@]}" \
              --title "إيقاع اليوم | DayRhythm ($TAG)" \
              --notes-file release-notes.md \
              --latest; then
              exit 0
            fi
            echo "Attempt $attempt failed; cleaning up partial release and retrying in 5s..."
            gh release delete "$TAG" --repo "${{ github.repository }}" --cleanup-tag --yes 2>/dev/null || true
            sleep 5
          done
          exit 1
